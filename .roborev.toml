review_guidelines = """
Threat model for multi-machine sync (fleet):

- The hub and all spokes are the same user's machines sharing a bearer
  token; they mutually trust each other. Do not flag attacks that require
  a malicious or compromised authenticated peer or hub (e.g., terminal
  escape injection via manifest fields, hub-crafted state responses).
- Repo-local `.kwt.toml` files arrive with cloned repositories and are
  untrusted, even after the user grants the trust prompt. They must never
  set machine-level configuration: anything under `fleet.*` (hub endpoint,
  token env/file sources) is global-config-only. Do flag any path that
  lets repo content influence where tokens are read from or sent to.
- Secrets must never leave the machine: raw git remote URLs (which can
  embed credentials), token values, and token file paths must not be
  published to the hub, persisted in hub state, or echoed in fleet state.
- Plaintext HTTP to the hub is only acceptable for loopback addresses;
  multi-machine hubs require HTTPS.

Threat model for local execution:

- kwt is a local developer CLI run by the machine's owner. The user's own
  execution environment — PATH, SHELL, shell profiles and rc files, tmux
  configuration, and environment variables — is trusted input. Do not
  flag attacks that presuppose a hostile or misconfigured local
  environment: relative PATH components (".", "bin") causing
  working-directory-relative binary resolution, malicious binaries
  already on PATH, or hostile shell aliases/profile hooks. Any such
  precondition already grants arbitrary code execution through git, make,
  or the shell itself, independent of anything kwt does.
- Repository *contents* remain untrusted for machine-level configuration
  (the `.kwt.toml` rule above), but command resolution through the
  user's PATH is the user's domain, not the repository's.

Threat model for pull-request discovery and import:

- Pull-request metadata, Git refs, fork repositories, and every file in a
  fetched PR checkout are contributor-controlled and untrusted. API
  authentication proves the kwt user's access; it does not make a PR trusted.
  Apply this equally to same-repository and fork PRs.
- Import is an explicit mutation initiated by the local user, but PR imports
  do not run repository `copy_files` or `setup_commands`. Git remote handling,
  fetch, isolated checkout, push routing, and ownership-aware rollback are one
  operation delegated to `go.kenn.io/kit/git/managed`; do not require a second
  KWT-local implementation of those mechanics. Review the KWT adapter for
  correct trusted project identity, provider head metadata, exact expected
  OID, destination path, error mapping, and preservation reporting.
- `KWT_GITHUB_TOKEN`, fleet bearer tokens and token-file locations, and
  credential-bearing remote URLs remain sensitive. Flag persistence, output,
  transmission, or unnecessary environment inheritance that exposes them to
  contributor-controlled processes. Ordinary developer credentials and
  environment outside kwt's own token/config surfaces remain the user's
  responsibility under the local-execution model above.
- Cross-project and SSH invocation must resolve configuration from the
  selected target project, never from the caller's current repository. In
  noninteractive mode kwt may load only global config and an already trusted
  target config; it must not prompt, auto-trust, or silently accept a new
  repository-local policy.
- A successful import may fetch contributor refs, create a local branch and
  worktree, add a clean credential-free remote, and configure pushes to the
  PR's head branch. It must not push during import or redirect a later plain
  `git push` to the base repository when the PR came from a fork.
- Kit owns validation of configured fork routing. If Kit completes checkout
  without optional fork tracking, KWT must fail closed for plain pushes rather
  than duplicating Kit's remote-selection and URL-validation implementation.
- Repeating an import validates KWT's persisted provenance and the live
  worktree path and branch. It does not push, and it does not rewrite Git
  remotes or routing changed by the same local user after import; those remain
  trusted user-owned configuration under the local-execution model above.
- GitHub owner/repository identity is case-insensitive. Ref names, local paths,
  opaque IDs, and provenance keys remain exact data and require their own
  validation; do not transfer GitHub's case-folding rule to arbitrary Git or
  filesystem values.
- Keep severity tied to consequence. Credential disclosure, trust bypass,
  unexpected code execution, ref/path injection, or pushing to the wrong
  repository are security findings. JSON/exit-status ordering, Git-version
  compatibility, stale-state handling, and error classification are important
  correctness or compatibility findings unless they create one of those
  concrete security consequences.
"""
